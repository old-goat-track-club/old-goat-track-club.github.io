services:
  ogtc-dev:
    container_name: ogtc-dev
    image: node:22
    ports:
      - "8000:8000"
    volumes:
      - ./:/tmp/ogtc
      # Keep the container install off the host tree. The mount above would
      # otherwise let `npm ci` overwrite host node_modules with Linux binaries,
      # breaking the darwin/arm64 install used by `npm run dev`.
      - ogtc-dev-node_modules:/tmp/ogtc/node_modules
    working_dir: /tmp/ogtc
    command: bash -c "npm ci && npm run format && npm run dev"
  ogtc-watch:
    container_name: ogtc-watch
    image: node:22
    volumes:
      - ./:/tmp/ogtc
      # Separate volume from ogtc-dev: both services run `npm ci` on start, so
      # sharing one would race on the same files.
      - ogtc-watch-node_modules:/tmp/ogtc/node_modules
    working_dir: /tmp/ogtc
    command: bash -c "npm ci && npm run format-watch"
  image-optimizer:
    build:
      context: .
      dockerfile: ./image-optimizer/Dockerfile
    image: image-optimizer
    volumes:
      - .:/repo
    # This prevents the optimizer from starting automatically with 'docker-compose up'
    profiles:
      - tools
  roster-images:
    image: node:22
    volumes:
      - ./:/repo
      # Own install so this tool never races the dev server over node_modules.
      - roster-images-node_modules:/repo/node_modules
    working_dir: /repo
    # An entrypoint, not a command, so `docker compose run ... --strategy x`
    # appends its arguments to the script instead of being swallowed.
    entrypoint: ["sh", "scripts/roster-images.sh"]
    profiles:
      - tools

volumes:
  ogtc-dev-node_modules:
  ogtc-watch-node_modules:
  roster-images-node_modules:
